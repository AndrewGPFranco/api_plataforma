services:
  postgres:
    image: 'postgres:16'
    container_name: db_plataform
    restart: unless-stopped
    environment:
      - 'POSTGRES_DB=${DB_PLATAFORM}'
      - 'POSTGRES_PASSWORD=${PASSWORD_DB_PLATAFORM}'
      - 'POSTGRES_USER=${USER_DB_PLATAFORM}'
    ports:
      - '5488:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:latest
    container_name: redis_plataforma
    ports:
      - "6382:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres-data:
    external: true
    name: plataform_postgres-data
  redis_data:
