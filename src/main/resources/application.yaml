spring:
  application:
    name: plataforma
  datasource:
    url: jdbc:postgresql://${HOST_DB_PLATAFORM:localhost}:${PORT_DB_PLATAFORM:5488}/${DB_PLATAFORM}
    username: ${USER_DB_PLATAFORM}
    password: ${PASSWORD_DB_PLATAFORM}
  docker:
    compose:
      enabled: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 4
server:
  port: ${PORT:8008}
